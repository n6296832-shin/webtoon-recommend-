name: Crawl webtoons

on:
  schedule:
    - cron: "0 */6 * * *" # 6시간마다 실행 (UTC 기준)
  workflow_dispatch: {} # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm run crawl

      - name: Commit and push if data changed
        run: |
          git config user.name "webtoon-crawler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/webtoons.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update webtoon data"
          git push
